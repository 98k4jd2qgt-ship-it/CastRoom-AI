<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" role="img" aria-label="CastRoom AI 简化架构图">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07100f"/>
      <stop offset="0.55" stop-color="#0d1518"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 58px; font-weight: 800; fill: #f2fff9; }
      .subtitle { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 25px; font-weight: 500; fill: #9fb7b3; }
      .card-title { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 31px; font-weight: 800; fill: #f3fff9; }
      .card-text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 22px; font-weight: 520; fill: #b7c9c6; }
      .center-title { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 34px; font-weight: 800; fill: #081311; }
      .center-text { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 25px; font-weight: 650; fill: #0e2d27; }
      .small { font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", Arial, sans-serif; font-size: 18px; font-weight: 700; fill: #7bdba9; letter-spacing: 0.5px; }
      .box { fill: #111a1d; stroke: #25433e; stroke-width: 2; rx: 28; filter: url(#softShadow); }
      .box-accent { fill: #13231f; stroke: #4aae86; stroke-width: 2.5; rx: 28; filter: url(#softShadow); }
      .center { fill: #9af1bd; stroke: #d7ffe9; stroke-width: 3; rx: 32; filter: url(#softShadow); }
      .line { stroke: #5fd69b; stroke-width: 4; stroke-linecap: round; opacity: 0.72; }
      .line-soft { stroke: #426861; stroke-width: 3; stroke-linecap: round; opacity: 0.65; stroke-dasharray: 10 10; }
      .dot { fill: #6ee7a8; }
    </style>
  </defs>
  <rect width="1920" height="1080" fill="url(#bg)"/>
  <circle cx="1680" cy="140" r="220" fill="#16372c" opacity="0.22"/>
  <circle cx="210" cy="940" r="260" fill="#173044" opacity="0.18"/>
  <text x="120" y="110" class="small">CASTROOM AI</text>
  <text x="120" y="172" class="title">简化架构图</text>
  <text x="120" y="218" class="subtitle">自动推演 · Director · 记忆 · 防泄漏</text>
  <rect x="740" y="390" width="440" height="230" class="center"/>
  <text x="960" y="464" text-anchor="middle" class="center-title">房间运行核心</text>
  <text x="960" y="512" text-anchor="middle" class="center-text">普通聊天走短路径：</text>
  <text x="960" y="548" text-anchor="middle" class="center-text">角色直接接话。</text>
  <text x="960" y="594" text-anchor="middle" class="center-text">需要时才让 Director 介入。</text>
  <rect x="120" y="310" width="420" height="190" class="box-accent"/>
  <text x="165" y="372" class="card-title">房间界面</text>
  <text x="165" y="418" class="card-text">公开频道 · 私聊</text>
  <text x="165" y="454" class="card-text">Director 后台频道</text>
  <rect x="120" y="610" width="420" height="190" class="box"/>
  <text x="165" y="672" class="card-title">自动推演</text>
  <text x="165" y="718" class="card-text">决定谁说话</text>
  <text x="165" y="754" class="card-text">让连续房间继续推进</text>
  <rect x="750" y="745" width="420" height="190" class="box"/>
  <text x="795" y="807" class="card-title">AI 角色</text>
  <text x="795" y="853" class="card-text">自然接话</text>
  <text x="795" y="889" class="card-text">遵守可见性边界</text>
  <rect x="1380" y="310" width="420" height="190" class="box-accent"/>
  <text x="1425" y="372" class="card-title">Director</text>
  <text x="1425" y="418" class="card-text">旁白 · 裁定</text>
  <text x="1425" y="454" class="card-text">阶段推进 · 防卡住</text>
  <rect x="1380" y="610" width="420" height="190" class="box"/>
  <text x="1425" y="672" class="card-title">防泄漏边界</text>
  <text x="1425" y="718" class="card-text">私聊、阵营、后台各自隔离</text>
  <text x="1425" y="754" class="card-text">公开输出先经过检查</text>
  <rect x="750" y="155" width="420" height="190" class="box"/>
  <text x="795" y="217" class="card-title">记忆图谱</text>
  <text x="795" y="263" class="card-text">说法 · 信念 · 冲突</text>
  <text x="795" y="299" class="card-text">确认事实</text>
  <path d="M540 405 C630 405 655 455 740 480" class="line"/>
  <path d="M540 705 C642 705 650 585 740 555" class="line"/>
  <path d="M960 745 L960 620" class="line"/>
  <path d="M1180 480 C1265 455 1290 405 1380 405" class="line"/>
  <path d="M1180 555 C1270 585 1278 705 1380 705" class="line"/>
  <path d="M960 345 L960 390" class="line"/>
  <path d="M1590 610 C1590 545 1500 535 1420 500" class="line-soft"/>
  <path d="M750 250 C595 250 510 302 450 310" class="line-soft"/>
  <circle cx="690" cy="465" r="8" class="dot"/>
  <circle cx="690" cy="565" r="8" class="dot"/>
  <circle cx="1230" cy="465" r="8" class="dot"/>
  <circle cx="1230" cy="565" r="8" class="dot"/>
  <text x="960" y="1010" text-anchor="middle" class="subtitle">默认走短路径；需要结构、保护和连续性时，由 Director 与记忆系统接手。</text>
</svg>
