name: Feature request
description: Suggest a CastRoom AI feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem rather than only naming a feature. Do not include API keys, private memories, private prompts, or proprietary assets.
  - type: textarea
    id: problem
    attributes:
      label: Problem or user story
      placeholder: As a user, I want to ..., because ...
    validations:
      required: true
  - type: textarea
    id: desired
    attributes:
      label: Desired behavior
      placeholder: What should CastRoom AI do?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      placeholder: How would this improve Room flow, Director control, memory review, AI setup, or the desktop experience?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: Is there a current workaround or a smaller version of the feature?
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Room
        - Director
        - Channels
        - Prompt Center
        - Memory Graph
        - AI setup
        - Packaging
        - Other
    validations:
      required: false
